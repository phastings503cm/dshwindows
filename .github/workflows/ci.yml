# Checks every pull request and every push to a branch other than the default one (the default
# branch is covered by release.yml, which runs the same checks before it publishes).
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core:
    name: Core tests (Linux)
    if: github.event_name != 'push' || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Vision.Core.Tests -c Release --logger "console;verbosity=minimal"

  windows:
    name: Windows build, tests and UI self-test
    if: github.event_name != 'push' || github.ref_name != github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Vision.sln -c Release

      - name: "Test (includes the Windows-only tests: ConPTY, paths, PowerShell)"
        run: dotnet test tests/Vision.Core.Tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: "App tests (task queue, /goal, background agents, vault)"
        run: dotnet test tests/Vision.App.Tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: "Machine tool tests (screenshots, windows, input)"
        run: dotnet test tests/Vision.Windows.Tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (./scripts/find-iscc.ps1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }
          Write-Host "Inno Setup compiler: $(./scripts/find-iscc.ps1)"

      - name: Package (x64 portable zip and installer)
        id: package
        shell: pwsh
        run: ./scripts/package.ps1 -Arch x64 -SkipReadyToRun

      - name: UI self-test
        shell: pwsh
        run: ./scripts/self-test.ps1 -Exe artifacts/publish/win-x64/Vision/Vision.exe -Output "$env:RUNNER_TEMP/selftest"

      # Legacy: the last release under the app's former name (DSH). The installer test installs it first and fills
      # its data folder and a Credential Manager key, so it checks the upgrade users get: the old folder, shortcuts
      # and folder menu replaced, then Vision.exe --migrate-only bringing the data and key over and reading them back.
      - name: Download the last release under the former name
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.85 --repo "${{ github.repository }}" --pattern 'DSH-0.8.85-win-x64-setup.exe' --dir "$env:RUNNER_TEMP/legacy"
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the former version for the upgrade test failed.' }

      - name: "Installer test: upgrade from the former name, bring its data over, launch, uninstall"
        shell: pwsh
        run: ./scripts/installer-test.ps1 -Installer "artifacts/Vision-${{ steps.package.outputs.version }}-win-x64-setup.exe" -LegacyInstaller "$env:RUNNER_TEMP/legacy/DSH-0.8.85-win-x64-setup.exe" -Output "$env:RUNNER_TEMP/installer-test"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*.txt
            ${{ runner.temp }}/installer-test/*.log
            ${{ runner.temp }}/installer-test/*.json
            ${{ runner.temp }}/installer-test/selftest/*.txt
            ${{ runner.temp }}/installer-test/legacy-selftest/*.txt
          if-no-files-found: ignore

      - name: Print screenshot previews
        if: always()
        shell: powershell
        run: ./scripts/print-screenshots.ps1 -Folder "$env:RUNNER_TEMP/selftest"

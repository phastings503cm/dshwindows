# Checks every pull request and every push to a branch other than the default one (the default
# branch is covered by release.yml, which runs the same checks before it publishes).
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core:
    name: Core tests (Linux)
    if: github.event_name != 'push' || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Dsh.Core.Tests -c Release --logger "console;verbosity=minimal"

  windows:
    name: Windows build, tests and UI self-test
    if: github.event_name != 'push' || github.ref_name != github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build DSH.sln -c Release

      - name: "Test (includes the Windows-only tests: ConPTY, paths, PowerShell)"
        run: dotnet test tests/Dsh.Core.Tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: "App tests (task queue, /goal, background agents, vault)"
        run: dotnet test tests/Dsh.App.Tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (./scripts/find-iscc.ps1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }
          Write-Host "Inno Setup compiler: $(./scripts/find-iscc.ps1)"

      - name: Package (x64 portable zip and installer)
        id: package
        shell: pwsh
        run: ./scripts/package.ps1 -Arch x64 -SkipReadyToRun

      - name: UI self-test
        shell: pwsh
        run: ./scripts/self-test.ps1 -Exe artifacts/publish/win-x64/DSH/DSH.exe -Output "$env:RUNNER_TEMP/selftest"

      - name: "Installer test: silent install, launch, uninstall"
        shell: pwsh
        run: ./scripts/installer-test.ps1 -Installer "artifacts/DSH-${{ steps.package.outputs.version }}-win-x64-setup.exe" -Output "$env:RUNNER_TEMP/installer-test"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*.txt
            ${{ runner.temp }}/installer-test/*.log
            ${{ runner.temp }}/installer-test/selftest/*.txt
          if-no-files-found: ignore

      - name: Print screenshot previews
        if: always()
        shell: powershell
        run: ./scripts/print-screenshots.ps1 -Folder "$env:RUNNER_TEMP/selftest"

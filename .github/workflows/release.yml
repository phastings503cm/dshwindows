# Every push to the default branch builds, tests and publishes a GitHub release: installers and
# portable zips for x64 and ARM64, plus SHA256SUMS. The version is major.minor from
# Directory.Build.props plus the commit count, so each release is unique and increasing.
name: Release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate:
    name: Release only from the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Asked at run time rather than read from the event: the first push to an empty
          # repository makes that branch the default, which the push event may not show yet.
          default=$(gh api "repos/$REPO" --jq .default_branch)
          echo "Default branch: $default. This run: $REF_TYPE $REF_NAME."
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$default" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish release
    # Whatever the default branch is called; other branches are checked by ci.yml.
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    # One release at a time, newest push last. Job-level, so pushes to other branches never
    # queue behind (or cancel) a pending release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $prefix = @($props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ })[0]
          $parts = $prefix.Split('.')
          $count = (git rev-list --count HEAD).Trim()
          $version = "$($parts[0]).$($parts[1]).$count"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Vision $version"

      - name: Test
        run: dotnet test tests/Vision.Core.Tests -c Release --logger "console;verbosity=minimal"

      - name: App tests
        run: dotnet test tests/Vision.App.Tests -c Release --logger "console;verbosity=minimal"

      - name: Machine tool tests
        run: dotnet test tests/Vision.Windows.Tests -c Release --logger "console;verbosity=minimal"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (./scripts/find-iscc.ps1)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }
          Write-Host "Inno Setup compiler: $(./scripts/find-iscc.ps1)"

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: UI self-test (smoke test of the packaged app)
        shell: pwsh
        run: ./scripts/self-test.ps1 -Exe artifacts/publish/win-x64/Vision/Vision.exe -Output "$env:RUNNER_TEMP/selftest"

      # Legacy: the last release under the app's former name (DSH), for the upgrade check below.
      - name: Download the last release under the former name
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.85 --repo "${{ github.repository }}" --pattern 'DSH-0.8.85-win-x64-setup.exe' --dir "$env:RUNNER_TEMP/legacy"
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the former version for the upgrade test failed.' }

      - name: "Installer test: upgrade from the former name, bring its data over, launch, uninstall"
        shell: pwsh
        run: ./scripts/installer-test.ps1 -Installer "artifacts/Vision-${{ steps.version.outputs.version }}-win-x64-setup.exe" -LegacyInstaller "$env:RUNNER_TEMP/legacy/DSH-0.8.85-win-x64-setup.exe" -Output "$env:RUNNER_TEMP/installer-test"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*.txt
            ${{ runner.temp }}/installer-test/*.log
            ${{ runner.temp }}/installer-test/*.json
            ${{ runner.temp }}/installer-test/selftest/*.txt
            ${{ runner.temp }}/installer-test/legacy-selftest/*.txt
          if-no-files-found: ignore

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $previous = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $changes = git log $range --no-merges --pretty=format:'- %s (%h)' | Select-Object -First 60
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          $lines = @()
          # Legacy: the first release after the rename says once that the app was called DSH (releases before 0.9).
          $previousVersion = if ($previous) { [version] ($previous.TrimStart('v')) } else { $null }
          if ($previousVersion -and $previousVersion -lt [version] '0.9.0') {
            $lines += "Vision was previously called DSH: installing it upgrades DSH in place and keeps your chats, settings and keys."
            $lines += ""
            # Legacy: the rename's own commits name the former name, which the sentence above says once; they are left out
            # of the list below (the full diff link still has every commit).
            $changes = @($changes | Where-Object { $_ -notmatch '\bdsh\b' })
          }
          $lines += @(
            "## Download"
            ""
            "| | Installer | Portable zip |"
            "|---|---|---|"
            "| **Windows x64** (most PCs) | [Vision-$env:VERSION-win-x64-setup.exe]($base/Vision-$env:VERSION-win-x64-setup.exe) | [Vision-$env:VERSION-win-x64-portable.zip]($base/Vision-$env:VERSION-win-x64-portable.zip) |"
            "| **Windows on ARM** (Snapdragon, Surface Pro X) | [Vision-$env:VERSION-win-arm64-setup.exe]($base/Vision-$env:VERSION-win-arm64-setup.exe) | [Vision-$env:VERSION-win-arm64-portable.zip]($base/Vision-$env:VERSION-win-arm64-portable.zip) |"
            ""
            "The installer needs no administrator rights (it installs for your user) and adds Vision to the Start menu and, optionally, to the folder right-click menu. The portable zip runs from anywhere: unzip and start ``Vision\Vision.exe``."
            ""
            "Windows 10 (1809 or later) or Windows 11. Builds are self-contained: no .NET install needed. They are not code-signed yet, so SmartScreen may say *Windows protected your PC* — choose **More info → Run anyway**. Checksums are in ``SHA256SUMS.txt``."
            ""
            "## Changes"
            ""
          )
          if ($changes) { $lines += $changes } else { $lines += "- Build of $env:GITHUB_SHA" }
          if ($previous) { $lines += ""; $lines += "Full diff: https://github.com/${{ github.repository }}/compare/$previous...$env:TAG" }
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Name -like "Vision-$env:VERSION-*" } | ForEach-Object { $_.FullName }) + (Resolve-Path artifacts/SHA256SUMS.txt).Path
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A re-run of the same commit: refresh the assets in place.
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "Vision $env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }

</defs><g clip-path="url(#frame)"><rect width="600" height="270" fill="url(#bg)"/><circle cx="560" cy="30" r="90" fill="#c7d2fe" opacity="0.35"/><circle cx="40" cy="260" r="70" fill="#a5f3fc" opacity="0.3"/><circle cx="330.0" cy="300" r="60" fill="#c7d2fe" opacity="0.18"/><rect x="31" y="78" width="256" height="170" rx="14" fill="#1e293b" opacity="0.1" /><rect x="30" y="74" width="256" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><circle cx="66" cy="108" r="17" fill="#dcfce7"/><path d="M61.82,108.9 V105.05 A4.18,4.18 0 0 1 70.18,105.05 V108.9" fill="none" stroke="#16a34a" stroke-width="1.9800000000000002" stroke-linecap="round" stroke-linejoin="round"/><rect x="59.4" y="108.9" width="13.200000000000001" height="11.0" rx="2.2" fill="#16a34a" /><text x="92" y="104" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="start">A bank's website</text><text x="92" y="119" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="start">bank.example</text><circle cx="88" cy="176" r="30" fill="none" stroke="#16a34a" stroke-width="2.4"/><circle cx="88" cy="176" r="24" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.6"/><text x="88" y="173" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle" letter-spacing="0.4">VOUCHED</text><text x="88" y="184" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#16a34a" text-anchor="middle" letter-spacing="0.4">BY A CA</text><text x="130" y="164" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#1e293b" text-anchor="start">A public authority</text><text x="130" y="178" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start">signed its certificate,</text><text x="130" y="192" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start">so browsers know it.</text><rect x="48" y="214" width="120.69" height="20" rx="10.0" fill="#dcfce7" /><text x="108.345" y="227.42" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#16a34a" text-anchor="middle">Padlock, no warning</text><rect x="315" y="78" width="256" height="170" rx="14" fill="#1e293b" opacity="0.1" /><rect x="314" y="74" width="256" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><circle cx="350" cy="108" r="17" fill="#fef3c7"/><path d="M350,101.25 L357.5,114.0 L342.5,114.0 Z" fill="#d97706" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="349.175" y="105.375" width="1.6500000000000001" height="4.875" rx="0.75" fill="#ffffff" /><circle cx="350" cy="111.9" r="0.9750000000000001" fill="#ffffff"/><text x="376" y="104" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="start">Your Spark</text><text x="376" y="119" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="start">192.168.1.42</text><ellipse cx="383.752" cy="200.76" rx="40.92" ry="3.8015999999999996" fill="#1e293b" opacity="0.16000000000000003"/><path d="M346,172 L353.92,165.4 L419.92,165.4 L412,172 Z" fill="#e6cf9f" stroke="#a88549" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M412,172 L419.92,165.4 L419.92,189.16 L412,195.76 Z" fill="#a17c3f" stroke="#8a6a33" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="346" y="172" width="66" height="23.759999999999998" rx="0" fill="#c9a462" stroke="#8a6a33" stroke-width="1" /><rect x="349" y="175" width="60" height="17.759999999999998" rx="0" fill="url(#mesh)" /><circle cx="403" cy="188.76" r="2.3" fill="#4ade80"/><circle cx="403" cy="188.76" r="4.5" fill="#4ade80" opacity="0.25"/><text x="430" y="164" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#1e293b" text-anchor="start">It signed its own</text><text x="430" y="178" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start">certificate. Browsers</text><text x="430" y="192" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start">can't vouch for it.</text><rect x="332" y="214" width="148.23999999999998" height="20" rx="10.0" fill="#fef3c7" /><text x="406.12" y="227.42" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#d97706" text-anchor="middle">Warning — but it's yours</text><text x="30" y="38" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">What's that padlock warning?</text><text x="30" y="56" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">The connection is still encrypted. Only the "who vouches for it" part differs.</text></g></svg>
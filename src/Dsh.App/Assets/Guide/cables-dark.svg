>Cables first, power last</text><text x="30" y="56" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start">There's no power button: the Spark starts the moment it gets power.</text></g></svg>
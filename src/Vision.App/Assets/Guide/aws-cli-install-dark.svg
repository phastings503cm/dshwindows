</defs><g clip-path="url(#frame)"><rect width="600" height="270" fill="url(#bg)"/><circle cx="560" cy="30" r="90" fill="#312e81" opacity="0.35"/><circle cx="40" cy="260" r="70" fill="#155e75" opacity="0.3"/><circle cx="330.0" cy="300" r="60" fill="#312e81" opacity="0.18"/><rect x="41" y="76" width="330" height="178" rx="10" fill="#000000" opacity="0.35" /><rect x="40" y="72" width="330" height="178" rx="10" fill="#1e293b" stroke="#3e4f69" stroke-width="1" /><rect x="40" y="72" width="330" height="26" rx="10" fill="#273449" /><rect x="40" y="88" width="330" height="10" rx="0" fill="#273449" /><text x="52" y="89" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="start">AWS Command Line Interface v2 Setup</text><text x="58" y="124" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">Installing the AWS CLI</text><text x="58" y="140" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start">DSH uses it to sign you in and talk to your account.</text><rect x="58" y="158" width="294" height="10" rx="5" fill="#334155" /><rect x="58" y="158" width="199.92000000000002" height="10" rx="5" fill="url(#brandH)" /><text x="58" y="184" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start">Copying files…</text><rect x="278" y="214" width="74" height="22" rx="5" fill="#1e293b" stroke="#3e4f69" stroke-width="1" /><text x="315" y="229" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Cancel</text><rect x="401" y="84" width="176" height="92" rx="10" fill="#000000" opacity="0.35" /><rect x="400" y="80" width="176" height="92" rx="10" fill="#1e293b" stroke="#3e4f69" stroke-width="1" /><rect x="416" y="96" width="22" height="26" rx="4" fill="url(#brand)" /><path d="M427,100 L435,104 V111 C435,116 431,119 427,121 C423,119 419,116 419,111 V104 Z" fill="#ffffff" opacity="0.9"/><text x="446" y="106" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0" text-anchor="start">Just for you</text><text x="446" y="120" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start">installs in your user folder</text><rect x="416" y="138" width="98.64999999999999" height="18" rx="9.0" fill="#14532d" /><text x="465.325" y="150.42" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#22c55e" text-anchor="middle">No admin prompt</text><circle cx="412" cy="194" r="7" fill="#22c55e"/><path d="M408.85,194.14 L411.3,196.66 L415.36,191.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="197.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="start">Downloaded from Amazon</text><circle cx="412" cy="214" r="7" fill="#22c55e"/><path d="M408.85,214.14 L411.3,216.66 L415.36,211.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="217.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="start">Signature checked</text><circle cx="412" cy="234" r="7" fill="#22c55e"/><path d="M408.85,234.14 L411.3,236.66 L415.36,231.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="237.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="start">Installed</text><text x="30" y="38" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">One tool first: the AWS CLI</text><text x="30" y="56" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start">DSH downloads Amazon's official installer, checks its signature and runs it.</text></g></svg>
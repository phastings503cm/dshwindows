</defs><g clip-path="url(#frame)"><rect width="600" height="270" fill="url(#bg)"/><circle cx="560" cy="30" r="90" fill="#c7d2fe" opacity="0.35"/><circle cx="40" cy="260" r="70" fill="#a5f3fc" opacity="0.3"/><circle cx="330.0" cy="300" r="60" fill="#c7d2fe" opacity="0.18"/><rect x="41" y="74" width="340" height="186" rx="12" fill="#1e293b" opacity="0.1" /><rect x="40" y="70" width="340" height="186" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="58" y="98" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Tell Anthropic how you'll use Claude</text><text x="58" y="122" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="start">Company or name</text><rect x="58" y="126" width="304" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="66" y="139" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9" font-weight="500" fill="#1e293b" text-anchor="start">Acme Studio</text><text x="58" y="156" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="start">Website</text><rect x="58" y="160" width="304" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="66" y="173" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9" font-weight="500" fill="#1e293b" text-anchor="start">https://acme.example</text><text x="58" y="190" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="start">What for</text><rect x="58" y="194" width="304" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="66" y="207" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9" font-weight="500" fill="#1e293b" text-anchor="start">Coding help for our team</text><rect x="262" y="222" width="100" height="22" rx="6" fill="url(#brand)" /><text x="312" y="237" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Send</text><rect x="405" y="100" width="172" height="124" rx="12" fill="#1e293b" opacity="0.1" /><rect x="404" y="96" width="172" height="124" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="490" y="120" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">Once per account</text><circle cx="420" cy="146" r="7" fill="#16a34a"/><path d="M416.85,146.14 L419.3,148.66 L423.36,143.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="433" y="149.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.3" font-weight="600" fill="#1e293b" text-anchor="start">Asked by Anthropic</text><circle cx="420" cy="170" r="7" fill="#16a34a"/><path d="M416.85,170.14 L419.3,172.66 L423.36,167.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="433" y="173.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.3" font-weight="600" fill="#1e293b" text-anchor="start">Sent through AWS</text><circle cx="420" cy="194" r="7" fill="#16a34a"/><path d="M416.85,194.14 L419.3,196.66 L423.36,191.55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="433" y="197.5" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.3" font-weight="600" fill="#1e293b" text-anchor="start">Covers every Claude</text><text x="30" y="38" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Claude asks a few questions, once</text><text x="30" y="56" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">A short form Anthropic requires before an AWS account first uses Claude.</text></g></svg>
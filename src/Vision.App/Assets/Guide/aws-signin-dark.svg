or="start">Updated profile dsh-bedrock</text><circle cx="566" cy="208" r="10" fill="#22c55e"/><path d="M561.5,208.2 L565.0,211.8 L570.8,204.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="386" y="214" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="start">Signed in to AWS</text><text x="386" y="229" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8" text-anchor="start">no keys to copy or paste</text><text x="30" y="38" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0" text-anchor="start">Sign in with your browser</text><text x="30" y="56" font-family="Inter, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start">The same sign-in as the AWS website. DSH never sees your password.</text></g></svg>